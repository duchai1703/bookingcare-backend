# ==========================================
# BOOKINGCARE PRODUCTION DOCKER COMPOSE — PostgreSQL 16 Migration
# Tệp: docker-compose.yml
# Vị trí triển khai: bookingcare-backend/ (root directory)
# Phiên bản: 3.0-PostgreSQL | Ngày: 2026-09-01
# Nguồn đặc tả: 06_KeHoach_ChuyenDoi_PostgreSQL.md
# ==========================================

# ==========================================
# CẤU TRÚC PHÂN VÙNG MẠNG CÔ LẬP (3-TIER NETWORK ISOLATION LAYOUT)
# Blueprint: Part2.md — Networks: frontend-net + backend-net
# NGHIÊM CẤM mạng phẳng bridge duy nhất cho toàn bộ 4 dịch vụ
# Container Frontend KHÔNG ĐƯỢC giao tiếp trực tiếp với db-postgres hoặc redis-cache
# ==========================================
networks:
  frontend-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
  backend-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"

# ==========================================
# CẤU TRÚC PHÂN VÙNG QUYỀN GHI Ổ ĐĨA VĨNH VIỄN (VOLUMES LAYOUT)
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

# ==========================================
# ĐẶC TẢ CHI TIẾT CẤU THÀNH 4 SERVICES HẠ TẦNG
# ==========================================
services:
  # ------------------------------------------
  # TẦNG DỮ LIỆU: Hệ quản trị cơ sở dữ liệu PostgreSQL 16
  # [Migration] Chuyển đổi từ MySQL 8.0 → PostgreSQL 16 Alpine
  # Deploy limits memory: 1024M | cpus: 1.0
  # Network: backend-net (CẤM expose ports ra ngoài khi production)
  # ------------------------------------------
  db-postgres:
    image: postgres:16-alpine
    container_name: db-postgres
    restart: always
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: bookingcare
      POSTGRES_USER: bookingcare_user
      POSTGRES_PASSWORD: StrongPgPass2026
      PGTZ: Asia/Ho_Chi_Minh
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c timezone=Asia/Ho_Chi_Minh
      -c log_timezone=Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    ports:
      - "5433:5432" # Mở cổng PostgreSQL 5433 cho Development (tránh xung đột với PG 14 local)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookingcare_user -d bookingcare"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ------------------------------------------
  # TẦNG ĐỆM CHỨA: Bộ nhớ lưu lịch sử chat AI và Idempotency Key VNPay
  # Blueprint: Part2.md — Service redis-cache
  # Chính sách eviction: volatile-lru (chỉ xóa key có TTL — bảo vệ Idempotency Key VNPay)
  # Deploy limits memory: 512M (headroom an toàn cho AOF)
  # Network: backend-net (CẤM expose ports ra ngoài)
  # ------------------------------------------
  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: always
    environment:
      REDIS_PASSWORD: StrongRedisP@ss2026
    env_file:
      - .env
    command: redis-server --requirepass $$REDIS_PASSWORD --maxmemory 128mb --maxmemory-policy volatile-lru --appendonly yes
    volumes:
      - redis_data:/data
      - /dev/urandom:/dev/urandom:ro
    networks:
      - backend-net
    ports:
      - "6379:6379" # Mở cổng Redis phục vụ Development
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ------------------------------------------
  # TẦNG ỨNG DỤNG: Core Engine Backend Node.js
  # Blueprint: Part2.md — Service app-backend
  # init: true — Giải phóng Node.js khỏi PID 1, bắt trọn vẹn SIGTERM cho Graceful Shutdown 8 bước
  # Deploy limits memory: 2048M (heap 1024M + C++ Allocator overhead 1024M — triệt tiêu Exit Code 137)
  # Networks: frontend-net + backend-net (cầu nối 2 phân vùng)
  # ------------------------------------------
  app-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-backend
    restart: always
    env_file:
      - .env
    init: true
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_OPTIONS: "--max-old-space-size=1024"
      DB_HOST: db-postgres
      DB_PORT: 5432
      DB_DIALECT: postgres
      DB_USERNAME: bookingcare_user
      DB_PASSWORD: StrongPgPass2026
      DB_NAME: bookingcare
      REDIS_HOST: redis-cache
      URL_REACT: http://localhost
      REDIS_PASSWORD: StrongRedisP@ss2026
      PORT: 8080
      VNP_RETURN_URL: http://localhost/payment-result
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8081:8080"
    expose:
      - "8080"
    dns:
      - 8.8.8.8
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db-postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - /dev/urandom:/dev/urandom:ro
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 2s
      retries: 3

  # ------------------------------------------
  # TẦNG BIÊN PROXY UI: Nginx Web Server điều hướng Frontend
  # Blueprint: Part2.md — Service app-frontend
  # Build args: VITE_BACKEND_URL, VITE_APP_NAME (Build-Time ARG — CẤM truyền qua environment Run-Time)
  # tmpfs: /tmp:size=256M, /var/cache/nginx:size=128M (tránh nghẽn bão hòa upload base64)
  # Network: frontend-net (CẤM truy cập trực tiếp db-postgres hoặc redis-cache)
  # ------------------------------------------
  app-frontend:
    build:
      context: ../bookingcare-frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost
        VITE_APP_NAME: BookingCare
    container_name: app-frontend
    restart: always
    ports:
      - "0.0.0.0:80:8080"
    networks:
      - frontend-net
    deploy:
      resources:
        limits:
          memory: 256M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - /tmp:size=256M
      - /var/cache/nginx:size=128M
    volumes:
      - backend_uploads:/usr/share/nginx/uploads:ro
      - /dev/urandom:/dev/urandom:ro
    depends_on:
      app-backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
