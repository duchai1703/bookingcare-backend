variables:
  CONTAINER_NAME: $CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"

# Sử dụng before_script để tính toán biến TARGET_BRANCH bằng Shell Script
before_script:
  - |
    if [ -n "$CI_COMMIT_BRANCH" ]; then
      export TARGET_BRANCH=$CI_COMMIT_BRANCH
    elif [ -n "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" ]; then
      export TARGET_BRANCH=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    else
      export TARGET_BRANCH=$CI_COMMIT_REF_SLUG
    fi
  - export CONTAINER_DEPLOY_IMAGE="$CI_REGISTRY_IMAGE:$TARGET_BRANCH-$CI_COMMIT_SHORT_SHA"
  - export CONTAINER_RELEASE_IMAGE="$CI_REGISTRY_IMAGE:$TARGET_BRANCH-latest"
  - echo "TARGET_BRANCH hiện tại là $TARGET_BRANCH"
  - echo "DEPLOY_IMAGE là $CONTAINER_DEPLOY_IMAGE"

stages:
  - build
  - test
  - release
  - deploy

# Build stage - Build Docker image và push lên registry
build:
  stage: build
  image:
    name: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: thedockerhost
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  tags:
    - build
  script:
    - docker -v
    - whoami
    - echo "TARGET_BRANCH is $TARGET_BRANCH"
    - echo "CONTAINER_DEPLOY_IMAGE is $CONTAINER_DEPLOY_IMAGE"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CONTAINER_DEPLOY_IMAGE .
    - docker push $CONTAINER_DEPLOY_IMAGE
    - docker logout $CI_REGISTRY

# Test stage - Run tests and linting
test:
  stage: test
  tags:
    - test
  script:
    - echo "testing..."

# Release stage - Tag and push latest image
release:
  stage: release
  image:
    name: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: thedockerhost
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  tags:
    - release
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CONTAINER_DEPLOY_IMAGE
    - docker tag $CONTAINER_DEPLOY_IMAGE $CONTAINER_RELEASE_IMAGE
    - docker push $CONTAINER_RELEASE_IMAGE
    - docker logout $CI_REGISTRY
  dependencies:
    - test

# Deploy to staging environment
deploy_staging:
  stage: deploy
  tags:
    - host
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  script:
    - docker -v
    - whoami
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CONTAINER_RELEASE_IMAGE
    # 1. Đảm bảo db-postgres đang chạy trên localnet
    - echo "Ensuring db-postgres is running on localnet..."
    - docker start db-postgres 2>/dev/null || docker run -d --name db-postgres --network localnet --restart always -e POSTGRES_DB=${DB_NAME:-bookingcare} -e POSTGRES_USER=${DB_USERNAME:-bookingcare_user} -e POSTGRES_PASSWORD=${DB_PASSWORD} -e TZ=Asia/Ho_Chi_Minh -e PGTZ=Asia/Ho_Chi_Minh -v postgres_data:/var/lib/postgresql/data postgres:16-alpine || true
    - sleep 6
    # 2. Dọn dẹp container backend cũ
    - if [ "$(docker ps -a -q -f name=app-backend)" ]; then docker stop app-backend && docker rm app-backend -f || true; fi
    - if [ "$(docker ps -a -q -f name=$CONTAINER_NAME)" ]; then docker stop $CONTAINER_NAME && docker rm $CONTAINER_NAME -f || true; fi
    # 3. Khởi chạy app-backend
    - echo "Deploying app-backend to staging..."
    - >
      docker run -d 
      --name app-backend 
      --network localnet 
      --network-alias bookingcare-backend 
      --restart always 
      -e NODE_ENV=staging 
      -e PORT=8080 
      -e TZ=Asia/Ho_Chi_Minh 
      -e DB_HOST=${DB_HOST:-db-postgres} 
      -e DB_PORT=${DB_PORT:-5432} 
      -e DB_NAME=${DB_NAME:-bookingcare} 
      -e DB_USERNAME=${DB_USERNAME:-bookingcare_user} 
      -e "DB_PASSWORD=${DB_PASSWORD}" 
      -e DB_DIALECT=postgres 
      -e "JWT_SECRET=${JWT_SECRET}" 
      -e AI_CHATBOT_ENABLED=true 
      -e GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite} 
      -e GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-3.5-flash-lite} 
      -e "GEMINI_API_KEY=${GEMINI_API_KEY}" 
      -e URL_REACT=https://bookingcare.s2.ttpprojects.com 
      -e "EMAIL_APP_USERNAME=${EMAIL_APP_USERNAME}" 
      -e "EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}" 
      -e "VNP_TMN_CODE=${VNP_TMN_CODE}" 
      -e "VNP_HASH_SECRET=${VNP_HASH_SECRET}" 
      -e VNP_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html 
      -e VNP_API_URL=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction 
      -e VNP_RETURN_URL=https://bookingcare.s2.ttpprojects.com/payment-result 
      -e "API_CRON_SECRET=${API_CRON_SECRET}" 
      -e "RECEIPT_FALLBACK_SECRET=${RECEIPT_FALLBACK_SECRET}" 
      -v bookingcare_uploads:/app/uploads 
      -l "traefik.enable=true" 
      -l "traefik.http.routers.bookingcare-backend-test.rule=Host(\`bookingcare-api-test.s2.ttpprojects.com\`)" 
      -l "traefik.http.routers.bookingcare-backend-test.entrypoints=websecure" 
      -l "traefik.http.routers.bookingcare-backend-test.tls=true" 
      -l "traefik.http.routers.bookingcare-backend-test.tls.certresolver=godaddy" 
      -l "traefik.http.services.bookingcare-backend-test-service.loadbalancer.server.port=8080" 
      $CONTAINER_RELEASE_IMAGE
    - sleep 8
    - echo "=== BACKEND STATUS ==="
    - docker ps -a -f name=app-backend
    - echo "=== CHECKING AND SEEDING DATABASE (SAFE IDEMPOTENT) ==="
    - docker exec app-backend node src/seeders/seedAllcode.js --safe
    - echo "=== RECENT APP-BACKEND LOGS ==="
    - docker logs --tail 30 app-backend
    - docker logout $CI_REGISTRY
  dependencies:
    - release
  environment:
    name: staging

# Deploy to production environment
deploy_production:
  stage: deploy
  tags:
    - host
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker -v
    - whoami
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CONTAINER_RELEASE_IMAGE
    # 1. Đảm bảo db-postgres đang chạy trên localnet
    - echo "Ensuring db-postgres is running on localnet..."
    - docker start db-postgres 2>/dev/null || docker run -d --name db-postgres --network localnet --restart always -e POSTGRES_DB=${DB_NAME:-bookingcare} -e POSTGRES_USER=${DB_USERNAME:-bookingcare_user} -e POSTGRES_PASSWORD=${DB_PASSWORD} -e TZ=Asia/Ho_Chi_Minh -e PGTZ=Asia/Ho_Chi_Minh -v postgres_data:/var/lib/postgresql/data postgres:16-alpine || true
    - sleep 6
    # 2. Dọn dẹp container backend cũ
    - if [ "$(docker ps -a -q -f name=app-backend)" ]; then docker stop app-backend && docker rm app-backend -f || true; fi
    - if [ "$(docker ps -a -q -f name=$CONTAINER_NAME)" ]; then docker stop $CONTAINER_NAME && docker rm $CONTAINER_NAME -f || true; fi
    # 3. Khởi chạy app-backend với tên định danh app-backend trên localnet
    - echo "Deploying app-backend to production..."
    - >
      docker run -d 
      --name app-backend 
      --network localnet 
      --network-alias bookingcare-backend 
      --restart always 
      -e NODE_ENV=production 
      -e PORT=8080 
      -e TZ=Asia/Ho_Chi_Minh 
      -e DB_HOST=${DB_HOST:-db-postgres} 
      -e DB_PORT=${DB_PORT:-5432} 
      -e DB_NAME=${DB_NAME:-bookingcare} 
      -e DB_USERNAME=${DB_USERNAME:-bookingcare_user} 
      -e "DB_PASSWORD=${DB_PASSWORD}" 
      -e DB_DIALECT=postgres 
      -e "JWT_SECRET=${JWT_SECRET}" 
      -e AI_CHATBOT_ENABLED=true 
      -e GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite} 
      -e GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-3.5-flash-lite} 
      -e "GEMINI_API_KEY=${GEMINI_API_KEY}" 
      -e URL_REACT=https://bookingcare.s2.ttpprojects.com 
      -e "EMAIL_APP_USERNAME=${EMAIL_APP_USERNAME}" 
      -e "EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}" 
      -e "VNP_TMN_CODE=${VNP_TMN_CODE}" 
      -e "VNP_HASH_SECRET=${VNP_HASH_SECRET}" 
      -e VNP_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html 
      -e VNP_API_URL=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction 
      -e VNP_RETURN_URL=https://bookingcare.s2.ttpprojects.com/payment-result 
      -e "API_CRON_SECRET=${API_CRON_SECRET}" 
      -e "RECEIPT_FALLBACK_SECRET=${RECEIPT_FALLBACK_SECRET}" 
      -v bookingcare_uploads:/app/uploads 
      -l "traefik.enable=true" 
      -l "traefik.http.routers.bookingcare-backend.rule=Host(\`bookingcare-api.s2.ttpprojects.com\`)" 
      -l "traefik.http.routers.bookingcare-backend.entrypoints=websecure" 
      -l "traefik.http.routers.bookingcare-backend.tls=true" 
      -l "traefik.http.routers.bookingcare-backend.tls.certresolver=godaddy" 
      -l "traefik.http.services.bookingcare-backend-service.loadbalancer.server.port=8080" 
      $CONTAINER_RELEASE_IMAGE
    - sleep 8
    - echo "=== BACKEND STATUS ==="
    - docker ps -a -f name=app-backend
    - echo "=== CHECKING AND SEEDING DATABASE (SAFE IDEMPOTENT) ==="
    - docker exec app-backend node src/seeders/seedAllcode.js --safe
    - echo "=== RECENT APP-BACKEND LOGS ==="
    - docker logs --tail 30 app-backend
    - docker logout $CI_REGISTRY
  dependencies:
    - release
  environment:
    name: production
