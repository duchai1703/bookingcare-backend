variables:
  CONTAINER_NAME: $CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"

# Sử dụng before_script để tính toán biến TARGET_BRANCH bằng Shell Script
before_script:
  - |
    if [ -n "$CI_COMMIT_BRANCH" ]; then
      export TARGET_BRANCH=$CI_COMMIT_BRANCH
    elif [ -n "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" ]; then
      export TARGET_BRANCH=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    else
      export TARGET_BRANCH=$CI_COMMIT_REF_SLUG
    fi
  - export CONTAINER_DEPLOY_IMAGE="$CI_REGISTRY_IMAGE:$TARGET_BRANCH-$CI_COMMIT_SHORT_SHA"
  - export CONTAINER_RELEASE_IMAGE="$CI_REGISTRY_IMAGE:$TARGET_BRANCH-latest"
  - echo "TARGET_BRANCH hiện tại là $TARGET_BRANCH"
  - echo "DEPLOY_IMAGE là $CONTAINER_DEPLOY_IMAGE"

stages:
  - build
  - test
  - release
  - deploy

# Build stage - Build Docker image và push lên registry
build:
  stage: build
  image:
    name: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: thedockerhost
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  tags:
    - build
  script:
    - docker -v
    - whoami
    - echo "TARGET_BRANCH is $TARGET_BRANCH"
    - echo "CONTAINER_DEPLOY_IMAGE is $CONTAINER_DEPLOY_IMAGE"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CONTAINER_DEPLOY_IMAGE .
    - docker push $CONTAINER_DEPLOY_IMAGE
    - docker logout $CI_REGISTRY

# Test stage - Run tests and linting
test:
  stage: test
  tags:
    - test
  script:
    - echo "testing..."

# Release stage - Tag and push latest image
release:
  stage: release
  image:
    name: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: thedockerhost
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  tags:
    - release
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CONTAINER_DEPLOY_IMAGE
    - docker tag $CONTAINER_DEPLOY_IMAGE $CONTAINER_RELEASE_IMAGE
    - docker push $CONTAINER_RELEASE_IMAGE
    - docker logout $CI_REGISTRY
  dependencies:
    - test

# Deploy to staging environment
deploy_staging:
  stage: deploy
  tags:
    - host
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  script:
    - docker -v
    - whoami
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CONTAINER_RELEASE_IMAGE
    # Lấy IMAGEID của container cũ để dọn dẹp
    - if docker inspect $CONTAINER_NAME &> /dev/null; then export IMAGEID=$(docker inspect --format='{{.Image}}' $CONTAINER_NAME); fi
    # Dừng và xóa container cũ
    - if [ "$(docker ps -a -q -f name=$CONTAINER_NAME)" ]; then docker stop $CONTAINER_NAME && docker rm $CONTAINER_NAME -f; fi
    # Xóa image cũ nếu tồn tại
    - if [ -n "$IMAGEID" ] && docker images --no-trunc --quiet | grep -q "$IMAGEID"; then docker rmi $IMAGEID -f || true; fi
    # Khởi chạy container mới từ Release Image
    - echo "Deploying backend to staging..."
    - >
      docker run -d 
      --name $CONTAINER_NAME 
      --network localnet 
      --network-alias app-backend 
      --restart always 
      -e NODE_ENV=staging 
      -e PORT=8080 
      -e TZ=Asia/Ho_Chi_Minh 
      -e DB_HOST=${DB_HOST:-db-postgres} 
      -e DB_PORT=${DB_PORT:-5432} 
      -e DB_NAME=${DB_NAME:-bookingcare} 
      -e DB_USERNAME=${DB_USERNAME:-bookingcare_user} 
      -e DB_PASSWORD=${DB_PASSWORD:-StrongPgPass2026} 
      -e DB_DIALECT=${DB_DIALECT:-postgres} 
      -e REDIS_HOST=${REDIS_HOST:-redis-cache} 
      -e REDIS_PASSWORD=${REDIS_PASSWORD:-StrongRedisP@ss2026} 
      -e JWT_SECRET=${JWT_SECRET:-BookingCareSecretKey2026} 
      -v bookingcare_uploads:/app/uploads 
      -l "traefik.enable=true" 
      -l "traefik.http.routers.bookingcare-backend-test.rule=Host(\`bookingcare-test.s2.ttpprojects.com\`) && PathPrefix(\`/api\`)" 
      -l "traefik.http.routers.bookingcare-backend-test.entrypoints=websecure" 
      -l "traefik.http.routers.bookingcare-backend-test.tls=true" 
      -l "traefik.http.routers.bookingcare-backend-test.tls.certresolver=godaddy" 
      -l "traefik.http.routers.bookingcare-backend-test.priority=100" 
      -l "traefik.http.routers.bookingcare-backend-test-direct.rule=Host(\`bookingcare-api-test.s2.ttpprojects.com\`)" 
      -l "traefik.http.routers.bookingcare-backend-test-direct.entrypoints=websecure" 
      -l "traefik.http.routers.bookingcare-backend-test-direct.tls=true" 
      -l "traefik.http.routers.bookingcare-backend-test-direct.tls.certresolver=godaddy" 
      -l "traefik.http.services.bookingcare-backend-test-service.loadbalancer.server.port=8080" 
      $CONTAINER_RELEASE_IMAGE
    - docker logout $CI_REGISTRY
  dependencies:
    - release
  environment:
    name: staging

# Deploy to production environment
deploy_production:
  stage: deploy
  tags:
    - host
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker -v
    - whoami
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CONTAINER_RELEASE_IMAGE
    # Lấy IMAGEID của container cũ để dọn dẹp
    - if docker inspect $CONTAINER_NAME &> /dev/null; then export IMAGEID=$(docker inspect --format='{{.Image}}' $CONTAINER_NAME); fi
    # Dừng và xóa container cũ
    - if [ "$(docker ps -a -q -f name=$CONTAINER_NAME)" ]; then docker stop $CONTAINER_NAME && docker rm $CONTAINER_NAME -f; fi
    # Xóa image cũ nếu tồn tại
    - if [ -n "$IMAGEID" ] && docker images --no-trunc --quiet | grep -q "$IMAGEID"; then docker rmi $IMAGEID -f || true; fi
    # Khởi chạy container mới từ Release Image
    - echo "Deploying backend to production..."
    - >
      docker run -d 
      --name $CONTAINER_NAME 
      --network localnet 
      --network-alias app-backend 
      --restart always 
      -e NODE_ENV=production 
      -e PORT=8080 
      -e TZ=Asia/Ho_Chi_Minh 
      -e DB_HOST=${DB_HOST:-db-postgres} 
      -e DB_PORT=${DB_PORT:-5432} 
      -e DB_NAME=${DB_NAME:-bookingcare} 
      -e DB_USERNAME=${DB_USERNAME:-bookingcare_user} 
      -e DB_PASSWORD=${DB_PASSWORD:-StrongPgPass2026} 
      -e DB_DIALECT=${DB_DIALECT:-postgres} 
      -e REDIS_HOST=${REDIS_HOST:-redis-cache} 
      -e REDIS_PASSWORD=${REDIS_PASSWORD:-StrongRedisP@ss2026} 
      -e JWT_SECRET=${JWT_SECRET:-BookingCareSecretKey2026} 
      -v bookingcare_uploads:/app/uploads 
      -l "traefik.enable=true" 
      -l "traefik.http.routers.bookingcare-backend.rule=Host(\`bookingcare.s2.ttpprojects.com\`) && PathPrefix(\`/api\`)" 
      -l "traefik.http.routers.bookingcare-backend.entrypoints=websecure" 
      -l "traefik.http.routers.bookingcare-backend.tls=true" 
      -l "traefik.http.routers.bookingcare-backend.tls.certresolver=godaddy" 
      -l "traefik.http.routers.bookingcare-backend.priority=100" 
      -l "traefik.http.routers.bookingcare-backend-direct.rule=Host(\`bookingcare-api.s2.ttpprojects.com\`)" 
      -l "traefik.http.routers.bookingcare-backend-direct.entrypoints=websecure" 
      -l "traefik.http.routers.bookingcare-backend-direct.tls=true" 
      -l "traefik.http.routers.bookingcare-backend-direct.tls.certresolver=godaddy" 
      -l "traefik.http.services.bookingcare-backend-service.loadbalancer.server.port=8080" 
      $CONTAINER_RELEASE_IMAGE
    - docker logout $CI_REGISTRY
  dependencies:
    - release
  environment:
    name: production
